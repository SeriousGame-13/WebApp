[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# assets 폴더의 모든 파일들을 정적으로 서빙 (리다이렉트 안함)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JavaScript와 CSS 파일들은 올바른 MIME type으로 서빙
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]  
  for = "*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

# SPA 라우팅 (assets는 제외)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"], Country = ["US"]}
  force = false